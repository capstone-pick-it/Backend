version: '3'

services:
  mysql:
    image: mysql:8.0
    container_name: pickit-mysql
    ports:
      - "3306:3306"
    environment:
      MYSQL_DATABASE: pickit
      MYSQL_USER: pickit
      MYSQL_PASSWORD: pickit_password
      MYSQL_ROOT_PASSWORD: root_password
    volumes:
      - mysql-data:/var/lib/mysql
    restart: always

  redis:
    image: redis:latest
    container_name: redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    restart: always

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pickit-backend
    ports:
      - "8080:8080"
    environment:
      DB_URL: jdbc:mysql://mysql:3306/pickit?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
      DB_USER: pickit
      DB_PW: pickit_password
      JWT_SECRET: ${JWT_SECRET}
      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
    depends_on:
      - mysql
      - redis
    restart: always

volumes:
  mysql-data:
  redis-data: