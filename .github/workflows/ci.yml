name: CI

on:
  pull_request:
    branches:
      - main
      - develop
      - 'feat/**'
      - 'feature/**'
      - 'infra/**'
      - 'fix/**'
      - 'chore/**'
      - 'refactor/**'

  push:
    branches:
      - main
      - develop
      - 'feat/**'
      - 'feature/**'
      - 'infra/**'
      - 'fix/**'
      - 'chore/**'
      - 'refactor/**'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744 # v4    # v4

      - name: Set up Java 21
        uses: actions/setup-java@v4 # v4
        with:
          distribution: temurin
          java-version: 21

      - name: Grant execute permission for Gradle
        run: chmod +x ./gradlew

      - name: Build with Gradle
        run: ./gradlew clean build -x test